// HARGA SIMULASI IDX - gerak tiap detik kayak Stockity, dihitung lokal, ga butuh internet API
let harga = 1000;
let closes = [];
for(let i=0;i<30;i++){ harga += (Math.random()-0.5)*4; closes.push(harga); }
let autoOn = false;
let detik = 60;

function hitungRSI(){
  let naik=0, turun=0;
  for(let i=1;i<closes.length;i++){
    let d = closes[i]-closes[i-1];
    if(d>0) naik+=d; else turun+=-d;
  }
  let rs = naik/(turun+0.0001);
  return Math.round(100-(100/(1+rs)));
}
