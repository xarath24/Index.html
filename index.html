<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FADER - MR18 STYLE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column}
.top{background:#111;border-bottom:1px solid #333;padding:8px 10px;font-size:13px;font-weight:900;flex:0 0 auto} .top span{color:#00d4ff}
.wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 6px 0;min-height:0}
.faders{display:flex;gap:4px;overflow-x:auto;padding:4px 0 0;flex:0 0 50%;height:50%;align-items:stretch;min-height:0}
.ch{flex:0 0 56px;background:#1c1c1c;border:1px solid #333;border-bottom:none;border-radius:4px 4px 0 0;padding:0 0 4px;text-align:center;user-select:none;display:flex;flex-direction:column}
.ch.sel{border-color:#00d4ff}
.ch.is-master{border-color:#d50000}
.ch.is-master .lbl{background:#d50000;color:#fff}
.lbl{height:28px;display:flex;align-items:center;justify-content:center;padding:0 2px;font-size:10px;font-weight:900;border-radius:3px 3px 0 0}
.c1{background:#00c853} .c2{background:#00bfa5} .c3{background:#fdd835;color:#000} .c4{background:#ff3d00} .c5{background:#2979ff} .c6{background:#00e5ff;color:#000} .c7{background:#ff4081} .c8{background:#7c4dff}
.fx1{background:#ff6d00} .fx2{background:#00b0ff} .fx3{background:#aa00ff} .fx4{background:#00c853}
.dca1{background:#ffab00;color:#000} .dca2{background:#ff6d00} .dca3{background:#00bfa5}
.solo{width:90%;margin:4px auto 0;padding:4px 0;border:1px solid #444;background:#222;color:#aaa;border-radius:3px;font-size:10px;font-weight:900;cursor:pointer}
.solo.on{background:#fdd835;color:#000;border-color:#ffeb3b}
.val{font-size:11px;font-weight:700;margin-top:4px;color:#ddd}
.chNum{height:22px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#aaa}
.faderArea{display:flex;justify-content:center;gap:2px;flex:1;min-height:80px;margin-top:4px}
.db{font-size:7px;color:#777;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0;text-align:right}
.faderTrack{width:14px;height:100%;background:#000;border:1px solid #444;border-radius:2px;position:relative}
/* KNOP DIKECILIN - DARI 26x30 JADI 20x22 */
.fader{width:20px;height:22px;background:linear-gradient(180deg,#ffffff 0%,#d7d7d7 18%,#8a8a8a 38%,#e8e8e8 50%,#9a9a9a 62%,#d0d0d0 82%,#ffffff 100%);border:1px solid #666;border-radius:3px;position:absolute;left:-3px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;box-shadow:0 2px 6px rgba(0,0,0,.9), inset 0 1px 0 #fff}
.fader::before{content:'';width:16px;height:2px;background:#fff;position:absolute;top:50%;transform:translateY(-50%)}
.mute{width:90%;margin:4px auto 0;padding:4px 0;border:1px solid #444;background:#222;color:#aaa;border-radius:3px;font-size:10px;font-weight:900;cursor:pointer}
.mute.on{background:#d50000;color:#fff;border-color:#ff5252}
.sep{flex:0 0 2px;background:#333;margin:0 2px}
</style>
</head>
<body>
<div class="top">🎛️ FADER <span>MIXER</span></div>
<div class="wrap"><div class="faders" id="faders"></div></div>

<script>
function getTrackH(){
 let t=document.querySelector('.faderTrack');
 return t ? t.clientHeight : 260;
}
const FADER_H=22;
function maxBottom(){ return getTrackH() - FADER_H - 4; }
function bottom(v){ return (v/100)*maxBottom(); }

let all=[
 {id:0,c:'c1',label:'1',sub:'CH 1',v:75,m:false,s:false},
 {id:1,c:'c2',label:'2',sub:'CH 2',v:68,m:false,s:false},
 {id:2,c:'c3',label:'3',sub:'CH 3',v:60,m:false,s:false},
 {id:3,c:'c4',label:'4',sub:'CH 4',v:62,m:false,s:false},
 {id:4,c:'c5',label:'5',sub:'CH 5',v:55,m:false,s:false},
 {id:5,c:'c6',label:'6',sub:'CH 6',v:70,m:false,s:false},
 {id:6,c:'c7',label:'7',sub:'CH 7',v:65,m:false,s:false},
 {id:7,c:'c8',label:'8',sub:'CH 8',v:50,m:false,s:false},
 {id:100,c:'fx1',label:'FX 1',sub:'EFFECT 1',v:60,m:false,s:false},
 {id:101,c:'fx2',label:'FX 2',sub:'EFFECT 2',v:55,m:false,s:false},
 {id:102,c:'fx3',label:'FX 3',sub:'EFFECT 3',v:50,m:false,s:false},
 {id:103,c:'fx4',label:'FX 4',sub:'EFFECT 4',v:65,m:false,s:false},
 {id:200,c:'dca1',label:'DCA 1',sub:'GROUP 1',v:70,m:false,s:false},
 {id:201,c:'dca2',label:'DCA 2',sub:'GROUP 2',v:65,m:false,s:false},
 {id:202,c:'dca3',label:'DCA 3',sub:'GROUP 3',v:60,m:false,s:false},
 {id:99,c:'master',label:'MASTER',sub:'L / R',v:80,m:false,s:false,isMaster:true},
];
let sel=0;
function getById(id){ return all.find(x=>x.id===id); }
function cardHTML(ch){
 return `<div class="ch ${ch.isMaster?'is-master':''} ${ch.id===sel?'sel':''}" data-ch="${ch.id}">
   <div class="lbl ${ch.c}">${ch.label}</div>
   <button class="solo ${ch.s?'on':''}" data-solo="${ch.id}">SOLO</button>
   <div class="val" data-val="${ch.id}">${ch.v}</div>
   <div class="chNum">${ch.sub}</div>
   <div class="faderArea">
     <div class="db"><span>10</span><span>0</span><span>-10</span><span>-20</span><span>-30</span><span>-40</span><span>-∞</span></div>
     <div class="faderTrack" data-track="${ch.id}"><div class="fader" data-fader="${ch.id}" style="bottom:${bottom(ch.v)}px"></div></div>
   </div>
   <button class="mute ${ch.m?'on':''}" data-mute="${ch.id}">${ch.m?'MUTED':'MUTE'}</button>
  </div>`;
}
function build(){
 let h='';
 all.forEach((ch)=>{
  if(ch.id===99) h+=`<div class="sep"></div>`;
  h+=cardHTML(ch);
 });
 document.getElementById('faders').innerHTML=h;
 all.forEach(ch=>updateFader(ch.id,ch.v));
}
function updateFader(id,v){
 let f=document.querySelector(`[data-fader="${id}"]`);
 let val=document.querySelector(`[data-val="${id}"]`);
 if(f){ f.style.bottom=bottom(v)+'px'; }
 if(val) val.innerText=v;
}
function updateMute(id){
 let b=document.querySelector(`[data-mute="${id}"]`);
 let ch=getById(id);
 if(!b||!ch) return;
 b.classList.toggle('on',ch.m); b.innerText=ch.m?'MUTED':'MUTE';
}
function updateSolo(id){
 let b=document.querySelector(`[data-solo="${id}"]`);
 let ch=getById(id);
 if(!b||!ch) return;
 b.classList.toggle('on',ch.s);
}
document.addEventListener('click',e=>{
 let solo=e.target.closest('[data-solo]');
 if(solo){
  e.stopPropagation();
  let ch=getById(parseInt(solo.dataset.solo));
  ch.s=!ch.s; updateSolo(ch.id); return;
 }
 let mute=e.target.closest('[data-mute]');
 if(mute){
  e.stopPropagation();
  let ch=getById(parseInt(mute.dataset.mute));
  ch.m=!ch.m; updateMute(ch.id); return;
 }
 let chEl=e.target.closest('[data-ch]');
 if(chEl){
  sel=parseInt(chEl.dataset.ch);
  document.querySelectorAll('.ch').forEach(el=>el.classList.remove('sel'));
  chEl.classList.add('sel');
 }
});
let drag=null, startY=0, startV=0;
document.addEventListener('pointerdown',e=>{
 let f=e.target.closest('[data-fader]');
 if(!f) return;
 let id=parseInt(f.dataset.fader);
 drag={id, fader:f};
 startY=e.clientY;
 startV=getById(id).v;
 f.setPointerCapture(e.pointerId);
 e.preventDefault();
});
document.addEventListener('pointermove',e=>{
 if(!drag) return;
 let deltaY = startY - e.clientY;
 let deltaV = Math.round((deltaY / maxBottom()) * 100);
 let v = Math.max(0, Math.min(100, startV + deltaV));
 getById(drag.id).v=v;
 updateFader(drag.id, v);
});
document.addEventListener('pointerup',()=>drag=null);
document.addEventListener('pointercancel',()=>drag=null);
window.addEventListener('resize',()=>{ all.forEach(ch=>updateFader(ch.id,ch.v)); });

build();
</script>
</body>
</html>
