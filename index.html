<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;padding:8px}
h2{text-align:center;color:#00e5ff;font-size:18px;padding:6px}
.box{background:#111;border:1px solid #333;border-radius:10px;padding:10px;margin-bottom:8px}
button{width:100%;padding:14px;font-size:15px;font-weight:bold;border:none;border-radius:8px;margin:4px 0;cursor:pointer}
.btnMic{background:#00e5ff;color:#000}
.btnNoise{background:#ff9100;color:#000}
.btnStop{background:#ff1744;color:#fff}
canvas{width:100%;height:200px;background:#000;border-radius:8px;display:block}
label{font-size:12px;color:#aaa}
input[type=range]{width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
.grid b{font-size:18px;color:#00e5ff}
select{width:100%;padding:10px;border-radius:8px;background:#222;color:#fff;border:1px solid #444}
</style>
</head>

<div class="box">

<button class="btnNoise" onclick="playNoise()">🔊 PLAY PINK NOISE DARI HP INI</button>
<button class="btnStop" onclick="stopAll()">⏹ STOP SEMUA</button>

<div>Phase @1k<br><b id="phase1k">- -°</b></div>
</div>

<label>Hold / Freeze</label>
<select id="mode" onchange="freezeMode=this.value">
