let autoOn=false, detik=60, hargaIDX=1000;

async function getHargaCryptoIDX(){
  // Crypto IDX = gabungan BTC 70% + ETH 30%, biar gerak mirip Stockity
  try{
    let b=await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT").then(r=>r.json());
    let e=await fetch("https://api.binance.com/api/v3/ticker/price?symbol=ETHUSDT").then(r=>r.json());
    let harga = (parseFloat(b.price)*0.70/65) + (parseFloat(e.price)*0.30/3.2);
    // Simulasi gerak OTC biar ada naik turun tiap detik kayak IDX
    hargaIDX = harga + (Math.random()-0.5)*2;
    return hargaIDX;
  }catch(e){ hargaIDX += (Math.random()-0.5)*3; return hargaIDX; }
}
